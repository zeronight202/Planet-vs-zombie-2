<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Plants vs Zombies</title>
    <style>
        body { background: #222; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        #game-container { position: relative; width: 350px; height: 300px; background: #5c8a3c; margin: 10px auto; border: 4px solid #333; overflow: hidden; touch-action: manipulation; }
        .grid-cell { position: absolute; width: 70px; height: 100px; border: 1px dashed rgba(255,255,255,0.2); box-sizing: border-box; }
        .ui { margin: 10px 0; font-size: 18px; }
        button { padding: 8px 15px; font-size: 16px; background: #ffcc00; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .entity { position: absolute; display: flex; align-items: center; justify-content: center; }
        .plant { width: 50px; height: 50px; font-size: 30px; z-index: 2; }
        .zombie { width: 40px; height: 60px; font-size: 28px; z-index: 2; }
        .bullet { width: 10px; height: 10px; background: #FFEB3B; border-radius: 50%; position: absolute; z-index: 3; }
    </style>
</head>
<body>
    <h2>Mini Plants vs Zombies</h2>
    <div class="ui">
        Mặt trời: <span id="sun-count">100</span> | 
        <button onclick="selectPlant()">Trồng Đậu (50☀️)</button>
    </div>
    <div id="game-container" onclick="handleGridClick(event)"></div>
    <p style="font-size: 13px; color: #ccc;">Chạm nút chọn cây, sau đó chạm vào ô trên sân để trồng!<br>Mặt trời tự động tăng theo thời gian.</p>

    <script>
        let suns = 100;
        let selected = false;
        const gridRows = 3;
        const gridCols = 5;
        const cellWidth = 70;
        const cellHeight = 100;

        let plants = []; 
        let zombies = []; 
        let bullets = []; 

        const container = document.getElementById('game-container');

        // Tạo lưới sân chơi
        for(let r=0; r<gridRows; r++) {
            for(let c=0; c<gridCols; c++) {
                let div = document.createElement('div');
                div.className = 'grid-cell';
                div.style.left = (c * cellWidth) + 'px';
                div.style.top = (r * cellHeight) + 'px';
                container.appendChild(div);
            }
        }

        function selectPlant() {
            if(suns >= 50) {
                selected = true;
                alert("Đã chọn cây! Chạm vào một ô trống trên sân.");
            } else {
                alert("Không đủ mặt trời!");
            }
        }

        function handleGridClick(e) {
            let rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let col = Math.floor(x / cellWidth);
            let row = Math.floor(y / cellHeight);

            if(selected && row >= 0 && row < gridRows && col >= 0 && col < gridCols) {
                let exists = plants.some(p => p.row === row && p.col === col);
                if(!exists) {
                    plants.push({row: row, col: col, hp: 100});
                    suns -= 50;
                    document.getElementById('sun-count').innerText = suns;
                    selected = false;
                    render();
                }
            }
        }

        // Zombie xuất hiện ngẫu nhiên
        setInterval(() => {
            let row = Math.floor(Math.random() * gridRows);
            zombies.push({row: row, x: 350, hp: 60});
        }, 6000);

        // Tự động sinh mặt trời
        setInterval(() => {
            suns += 25;
            document.getElementById('sun-count').innerText = suns;
        }, 8000);

        // Vòng lặp game chính
        setInterval(() => {
            // Đạn bay
            bullets.forEach(b => b.x += 6);
            bullets = bullets.filter(b => b.x < 350);

            // Zombie di chuyển và tấn công cây
            zombies.forEach(z => {
                let hitPlant = plants.find(p => p.row === z.row && Math.abs(p.col * cellWidth - z.x) < 25);
                if(hitPlant) {
                    hitPlant.hp -= 2;
                    if(hitPlant.hp <= 0) {
                        plants = plants.filter(p => p !== hitPlant);
                    }
                } else {
                    z.x -= 0.6;
                }
            });

            // Cây bắn đạn khi có zombie cùng hàng phía trước
            plants.forEach(p => {
                let hasZombie = zombies.some(z => z.row === p.row && z.x > p.col * cellWidth);
                if(hasZombie && Math.random() < 0.25) {
                    bullets.push({row: p.row, x: (p.col + 1) * cellWidth});
                }
            });

            // Va chạm đạn và zombie
            bullets.forEach((b, bi) => {
                zombies.forEach((z, zi) => {
                    if(b.row === z.row && Math.abs(b.x - z.x) < 20) {
                        z.hp -= 20;
                        bullets.splice(bi, 1);
                        if(z.hp <= 0) {
                            zombies.splice(zi, 1);
                        }
                    }
                });
            });

            // Kiểm tra thua cuộc
            zombies.forEach(z => {
                if(z.x < 0) {
                    alert("Game Over! Zombie đã tiến vào nhà!");
                    location.reload();
                }
            });

            render();
        }, 50);

        function render() {
            let oldEntities = container.querySelectorAll('.entity');
            oldEntities.forEach(el => el.remove());

            plants.forEach(p => {
                let div = document.createElement('div');
                div.className = 'entity plant';
                div.style.left = (p.col * cellWidth + 10) + 'px';
                div.style.top = (p.row * cellHeight + 25) + 'px';
                div.innerText = '🌻';
                container.appendChild(div);
            });

            zombies.forEach(z => {
                let div = document.createElement('div');
                div.className = 'entity zombie';
                div.style.left = z.x + 'px';
                div.style.top = (p_row = z.row * cellHeight + 20) + 'px';
                div.innerText = '🧟';
                container.appendChild(div);
            });

            bullets.forEach(b => {
                let div = document.createElement('div');
                div.className = 'bullet';
                div.style.left = b.x + 'px';
                div.style.top = (b.row * cellHeight + 45) + 'px';
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
